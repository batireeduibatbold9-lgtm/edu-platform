<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edu Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <section id="auth-view" class="center-screen">
    <div class="auth-card">
      <div class="brand">EDU<span>+</span></div>
      <p class="muted">Online learning platform</p>

      <div class="tabs">
        <button id="login-tab" class="tab active">Login</button>
        <button id="signup-tab" class="tab">Sign up</button>
      </div>

      <form id="login-form">
        <label>Email</label>
        <input id="login-email" type="email" required>
        <label>Password</label>
        <input id="login-password" type="password" required>
        <button class="primary full" type="submit">Login</button>
      </form>

      <form id="signup-form" class="hidden">
        <label>Full name</label>
        <input id="signup-name" required>
        <label>Email</label>
        <input id="signup-email" type="email" required>
        <label>Password</label>
        <input id="signup-password" type="password" minlength="6" required>
        <button class="primary full" type="submit">Create account</button>
      </form>
    </div>
  </section>

  <section id="app-view" class="hidden">
    <aside class="sidebar">
      <div class="brand">EDU<span>+</span></div>
      <div id="user-mini" class="user-mini"></div>
      <nav id="nav"></nav>
      <button id="logout-btn" class="danger ghost">Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="muted"></p>
        </div>
        <button id="refresh-btn" class="secondary">Refresh</button>
      </header>

      <div id="content"></div>
    </main>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modal-close" class="modal-close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
